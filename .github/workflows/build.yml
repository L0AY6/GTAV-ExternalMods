name: Build External AOT Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Publish Standalone AOT Mod
      shell: pwsh
      run: |
        dotnet publish LibertySuspensionMod.csproj -c Release -r win-x64 -o output

    - name: Upload Built Mod DLL
      uses: actions/upload-artifact@v4
      with:
        name: LibertySuspensionMod-AOT
        path: output/LibertySuspensionMod.mod.dll
        
